<style>
:root{
  --bg:#06080f;
  --bg2:#0d111d;
  --card:rgba(22, 28, 45, 0.72);
  --card2:#1c2338;
  --line:rgba(232, 199, 126, 0.14);
  --line-bright:rgba(232, 199, 126, 0.35);
  --tx:#f8f5ee;
  --mut:#8c95aa;
  --gold:#f0d28c;
  --gold2:#b8893d;
  --ok:#64d89b;
  --bad:#ff6b6b;
  color-scheme:dark;
}

*{
  box-sizing:border-box;
  margin:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% -10%, rgba(56, 48, 82, 0.55) 0%, transparent 50%),
    radial-gradient(circle at 90% 35%, rgba(232, 199, 126, 0.05) 0%, transparent 40%),
    var(--bg);
  color:var(--tx);
  font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}

body{
  padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));
}

.serif{
  font-family:"Iowan Old Style", "Playfair Display", Georgia, serif;
}

header{
  padding:24px 18px 10px;
  background:linear-gradient(180deg, rgba(16, 20, 33, 0.9) 0%, transparent 100%);
}

.me{
  display:flex;
  align-items:center;
  gap:14px;
}

.av{
  width:50px;
  height:50px;
  border-radius:16px;
  background:linear-gradient(135deg, #fae2a8 0%, #a87b32 100%);
  color:#140f07;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:19px;
  overflow:hidden;
  flex:none;
  border:1px solid rgba(255, 255, 255, 0.35);
  box-shadow:0 8px 24px rgba(218, 184, 111, 0.22);
}

.av img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.me b{
  display:block;
  font-size:16px;
  font-weight:700;
  letter-spacing:.2px;
}

.me small{
  color:var(--mut);
  font-size:12px;
}

/* Kartu Saldo dengan Efek Kilau & Kedalaman */
.bal{
  margin:20px 0 8px;
  padding:22px 20px;
  min-height:118px;
  border-radius:22px;
  background:
    radial-gradient(circle at 100% 0%, rgba(240, 210, 140, 0.24), transparent 52%),
    linear-gradient(145deg, #23293e 0%, #121726 100%);
  border:1px solid var(--line-bright);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 16px 36px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.14);
}

.bal:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.04) 50%, transparent 65%);
  pointer-events:none;
}

.bal:after{
  content:"";
  position:absolute;
  width:140px;
  height:140px;
  border:1px solid rgba(240, 210, 140, 0.12);
  border-radius:50%;
  right:-45px;
  top:-55px;
  box-shadow:
    0 0 0 18px rgba(240, 210, 140, 0.03),
    0 0 0 36px rgba(240, 210, 140, 0.015);
  pointer-events:none;
}

.bal small{
  color:var(--mut);
  display:block;
  font-size:12px;
  letter-spacing:.4px;
  text-transform:uppercase;
  margin-bottom:4px;
}

.bal .n{
  font-size:31px;
  font-weight:800;
  background:linear-gradient(135deg, #fff3d1 0%, var(--gold) 55%, #c89b4b 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:.3px;
  font-variant-numeric:tabular-nums;
}

main{
  padding:12px 18px;
}

h2{
  font-size:20px;
  font-weight:700;
  margin:10px 0 16px;
  letter-spacing:.2px;
  color:#fff;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}

.bk{
  border:1px solid var(--line);
  background:var(--card);
  backdrop-filter:blur(10px);
  color:var(--gold);
  border-radius:13px;
  width:40px;
  height:40px;
  font-size:22px;
  display:grid;
  place-items:center;
  cursor:pointer;
  transition:all .2s ease;
}

.bk:active{
  transform:scale(.94);
  border-color:var(--gold);
}

/* Grid Menu Utama */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.s{
  background:
    linear-gradient(155deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0.01) 100%),
    var(--card);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px 15px;
  min-height:96px;
  text-align:left;
  color:var(--tx);
  font:inherit;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0, 0, 0, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .2s, background .2s;
}

.s:before{
  content:"";
  position:absolute;
  width:72px;
  height:72px;
  background:radial-gradient(circle, rgba(240, 210, 140, 0.09) 0%, transparent 70%);
  border:1px solid rgba(240, 210, 140, 0.08);
  border-radius:50%;
  right:-26px;
  bottom:-28px;
  transition:.3s ease;
}

.s:hover{
  border-color:rgba(240, 210, 140, 0.3);
}

.s:active, .row:active{
  transform:scale(.97);
  border-color:var(--gold);
  background:var(--card2);
}

.s b{
  display:block;
  color:var(--gold);
  font-size:15.5px;
  font-weight:700;
  margin-bottom:5px;
  letter-spacing:.15px;
}

.s span{
  color:var(--mut);
  font-size:12px;
  line-height:1.4;
  display:block;
}

/* Daftar Item / Riwayat */
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:linear-gradient(135deg, rgba(25, 32, 51, 0.85), rgba(17, 22, 36, 0.9));
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px 16px;
  margin-bottom:10px;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition:transform .18s ease, border-color .2s;
}

.row .t{
  min-width:0;
}

.row .t b{
  display:block;
  font-weight:600;
  font-size:14.5px;
  margin-bottom:2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.row .t span{
  color:var(--mut);
  font-size:12px;
}

.row .p{
  color:var(--gold);
  font-weight:700;
  font-size:13.5px;
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
  background:rgba(240, 210, 140, 0.08);
  padding:5px 10px;
  border-radius:9px;
  border:1px solid rgba(240, 210, 140, 0.15);
}

/* Form & Input */
input,select,textarea{
  width:100%;
  background:rgba(11, 15, 26, 0.85);
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--tx);
  padding:14px;
  font:inherit;
  margin-bottom:12px;
  transition:border-color .2s, box-shadow .2s;
}

input::placeholder,textarea::placeholder{
  color:#586177;
}

input:focus,select:focus,textarea:focus{
  border-color:var(--gold);
  outline:none;
  box-shadow:0 0 0 3px rgba(240, 210, 140, 0.12);
  background:#0e1322;
}

label{
  display:block;
  color:var(--mut);
  font-size:12px;
  font-weight:500;
  margin:6px 0 7px;
}

/* Tombol Utama */
.btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  font:inherit;
  font-weight:700;
  letter-spacing:.3px;
  color:#171107;
  background:linear-gradient(135deg, #f8e2a8 0%, #c69646 100%);
  box-shadow:
    0 8px 22px rgba(198, 150, 70, 0.25),
    inset 0 1px 0 rgba(255, 255, 255, 0.45);
  cursor:pointer;
  transition:transform .16s ease, filter .2s;
}

.btn:hover{
  filter:brightness(1.05);
}

.btn:active{
  transform:scale(.98);
}

.btn.g{
  background:rgba(26, 33, 51, 0.8);
  color:var(--gold);
  border:1px solid var(--line);
  box-shadow:none;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* Chips / Pilihan Cepat */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:14px;
}

.chip{
  border:1px solid var(--line);
  background:rgba(17, 23, 39, 0.8);
  color:var(--tx);
  border-radius:12px;
  padding:9px 14px;
  font:inherit;
  font-size:12.5px;
  cursor:pointer;
  transition:.2s;
}

.chip.on{
  background:linear-gradient(135deg, #f8e2a8, #c69646);
  color:#171107;
  border-color:#fae6b4;
  font-weight:700;
  box-shadow:0 4px 12px rgba(198, 150, 70, 0.22);
}

/* Floating Bottom Navigation */
nav{
  position:fixed;
  left:12px;
  right:12px;
  bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;
  background:rgba(15, 20, 34, 0.82);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(240, 210, 140, 0.22);
  border-radius:22px;
  padding:8px 6px;
  box-shadow:
    0 14px 40px rgba(0, 0, 0, 0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.08);
  z-index:5;
}

nav button{
  flex:1;
  background:transparent;
  border:0;
  color:var(--mut);
  font:inherit;
  font-size:11px;
  font-weight:500;
  padding:6px 0;
  border-radius:14px;
  display:grid;
  gap:3px;
  justify-items:center;
  cursor:pointer;
  transition:all .2s ease;
}

nav button i{
  font-style:normal;
  font-size:20px;
  line-height:1.2;
  transition:transform .2s ease;
}

nav button.on{
  color:var(--gold);
  font-weight:700;
  background:rgba(240, 210, 140, 0.09);
}

nav button.on i{
  transform:translateY(-1px);
  text-shadow:0 0 14px rgba(240, 210, 140, 0.5);
}

/* Modal / Bottom Sheet */
.ov{
  position:fixed;
  inset:0;
  background:rgba(4, 6, 12, 0.78);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  display:flex;
  align-items:flex-end;
  z-index:9;
}

.sh{
  width:100%;
  max-height:88vh;
  overflow:auto;
  background:
    radial-gradient(circle at 100% 0%, rgba(240, 210, 140, 0.11), transparent 45%),
    #101524;
  border-radius:28px 28px 0 0;
  border-top:1px solid var(--line-bright);
  padding:14px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 55px rgba(0, 0, 0, 0.5);
  animation:slideUp .28s cubic-bezier(.16,1,.3,1);
}

/* Handle bar otomatis di atas Bottom Sheet */
.sh:before{
  content:"";
  display:block;
  width:40px;
  height:4px;
  border-radius:4px;
  background:rgba(255, 255, 255, 0.18);
  margin:0 auto 16px;
}

@keyframes slideUp{
  from{transform:translateY(45px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.kv{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
  font-size:13.5px;
}

.kv:last-of-type{
  border-bottom:none;
}

.kv span{
  color:var(--mut);
}

.kv b{
  word-break:break-all;
  text-align:right;
  font-weight:600;
}

.big{
  font-size:32px;
  background:linear-gradient(135deg, #fff3d1, var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  letter-spacing:3px;
  text-align:center;
  margin:18px 0;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

.msg{
  color:var(--mut);
  text-align:center;
  padding:32px 12px;
  font-size:13.5px;
  line-height:1.6;
}

.err{color:var(--bad)}
.ok{color:var(--ok)}

.sp{
  height:26px;
  width:26px;
  border:2.5px solid var(--line);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:r .75s linear infinite;
  margin:30px auto;
}

@keyframes r{
  to{transform:rotate(360deg)}
}

@media(max-width:360px){
  main{padding:10px 14px}
  header{padding-left:14px;padding-right:14px}
  .s{padding:14px 12px}
  .s b{font-size:14.5px}
  .bal .n{font-size:27px}
}

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
